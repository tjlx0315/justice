
<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>

        body {

            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        .btn-primary {
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }
        .option-card {
            transition: all 0.2s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .option-card:hover {
            background-color: #f0f9ff;
            border-color: #bae6fd;
        }

            background-color: #e0f2fe;
            border-color: #0ea5e9;
            color: #0369a1;
        }

            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }

            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .level-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .level-card {
            transition: all 0.3s ease;
        }

<body class="flex items-center justify-center p-4">

    <!-- 主容器 -->

            <div id="user-info" class="hidden flex items-center gap-4">

                </div>

                        <h3 class="font-semibold text-gray-700"><i class="fas fa-trophy text-yellow-500 mr-2"></i>总积分排行榜</h3>
                        <button onclick="clearLeaderboard()" class="text-xs text-red-400 hover:text-red-600 underline">清空记录</button>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4 h-48 overflow-y-auto no-scrollbar" id="leaderboard-list">
                        <div class="text-center text-gray-400 py-10">暂无排名数据</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 页面 2: 关卡选择 -->
        <div id="page-level-select" class="hidden flex-1 flex flex-col items-center justify-center fade-in">
            <h2 class="text-2xl font-bold text-gray-800 mb-8">请选择挑战关卡</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl px-4">
                <!-- Level 1 -->
                <div onclick="startLevel(0)" class="level-card bg-white p-6 rounded-xl shadow-md border border-gray-100 cursor-pointer hover:border-blue-300 group">
                    <div class="w-12 h-12 rounded-full bg-green-100 text-green-600 flex items-center justify-center mb-4 group-hover:bg-green-500 group-hover:text-white transition-colors">
                        <i class="fas fa-seedling text-xl"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">第一关</h3>
                    <p class="text-sm text-gray-500 mb-4">基础常识篇</p>
                    <div class="text-xs text-gray-400">难度: ★☆☆</div>
                </div>
                <!-- Level 2 -->
                <div onclick="startLevel(1)" class="level-card bg-white p-6 rounded-xl shadow-md border border-gray-100 cursor-pointer hover:border-blue-300 group">
                    <div class="w-12 h-12 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center mb-4 group-hover:bg-yellow-500 group-hover:text-white transition-colors">

                    <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-4 group-hover:bg-red-500 group-hover:text-white transition-colors">
                        <i class="fas fa-skull-crossbones text-xl"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">第三关</h3>
                    <p class="text-sm text-gray-500 mb-4">综合进阶篇</p>
                    <div class="text-xs text-gray-400">难度: ★★★</div>
                </div>
            </div>
        </div>

        <!-- 页面 3: 答题界面 -->
        <div id="page-quiz" class="hidden flex-1 flex flex-col fade-in">
            <!-- 进度条 -->
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            
            <div class="flex justify-between text-sm text-gray-500 mb-4">

                <span id="score-display">本关得分: 0</span>
            </div>

                </div>

                </h3>

                <div id="options-container" class="space-y-3">
                    <!-- 选项将在此生成 -->
                </div>
            </div>

            <!-- 底部按钮 -->
            <div class="mt-6 pt-4 border-t border-gray-100 flex justify-end">
                <button id="next-btn" onclick="nextQuestion()" class="bg-gray-300 text-gray-500 font-bold py-2 px-6 rounded-lg cursor-not-allowed transition-all" disabled>

                </button>
            </div>
        </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl mb-8">

                    <div class="text-gray-500 italic">恭喜！本关无错题。</div>
                </div>
            </div>

            <div class="flex gap-4">
                <button onclick="backToMenu()" class="btn-primary text-white font-bold py-2 px-8 rounded-lg shadow-md">
                    返回主页查看排行 <i class="fas fa-chevron-right ml-2"></i>
                </button>
            </div>
        </div>

    </div>

    <script>

                { q: "下列哪种物品可能含有毒品成分？", options: ["跳跳糖", "奶茶粉", "邮票", "以上都有可能"], a: 3 },

            // Level 2: 法律法规

            ]
        ];

        // --- 状态管理 ---
        let currentState = {
            username: '',
            currentLevel: 0, // 0-2
            currentQuestionIndex: 0,
            levelScore: 0,
            totalScore: 0,
            selectedOption: null,
            wrongAnswers: [], // 存储本关错题
        };

        // --- DOM 元素引用 ---
        const pages = {
            login: document.getElementById('page-login'),
            levelSelect: document.getElementById('page-level-select'),
            quiz: document.getElementById('page-quiz'),
            levelResult: document.getElementById('page-level-result')
        };
        const els = {
            usernameInput: document.getElementById('username-input'),
            loginError: document.getElementById('login-error'),
            leaderboardList: document.getElementById('leaderboard-list'),
            questionText: document.getElementById('question-text'),
            optionsContainer: document.getElementById('options-container'),
            progressBar: document.getElementById('progress-bar'),
            questionCounter: document.getElementById('question-counter'),
            scoreDisplay: document.getElementById('score-display'),
            nextBtn: document.getElementById('next-btn'),
            displayUsername: document.getElementById('display-username'),
            userInfo: document.getElementById('user-info'),
            resultLevelNum: document.getElementById('result-level-num'), // Note: Removed specific level num display in result for generic "Level Complete" or can add back if needed. Keeping simple.
            levelScore: document.getElementById('level-score'),
            levelCorrect: document.getElementById('level-correct'),
            wrongAnswersList: document.getElementById('wrong-answers-list')
        };

        // --- 初始化 ---
        window.onload = function() {
            renderLeaderboard();
        };

        // --- 核心逻辑 ---

        function switchPage(pageName) {
            Object.values(pages).forEach(el => el.classList.add('hidden'));
            pages[pageName].classList.remove('hidden');
        }

        function showLevelSelect() {
            const name = els.usernameInput.value.trim();
            if (!name) {
                els.loginError.classList.remove('hidden');
                return;
            }
            els.loginError.classList.add('hidden');
            currentState.username = name;
            els.displayUsername.textContent = name;
            els.userInfo.classList.remove('hidden');
            switchPage('levelSelect');
        }

        function backToMenu() {
            els.userInfo.classList.add('hidden');
            switchPage('login');
            renderLeaderboard();
        }

        function startLevel(levelIndex) {
            currentState.currentLevel = levelIndex;
            currentState.currentQuestionIndex = 0;
            currentState.levelScore = 0;
            currentState.wrongAnswers = [];
            currentState.selectedOption = null;

            loadQuestion();
            switchPage('quiz');
        }

        function loadQuestion() {
            const questions = levelsData[currentState.currentLevel];
            const qData = questions[currentState.currentQuestionIndex];
            
            // 更新进度
            const progress = ((currentState.currentQuestionIndex + 1) / questions.length) * 100;
            els.progressBar.style.width = `${progress}%`;
            els.questionCounter.textContent = `第 ${currentState.currentQuestionIndex + 1} / ${questions.length} 题`;
            els.scoreDisplay.textContent = `本关得分: ${currentState.levelScore}`;

            // 渲染题目
            els.questionText.textContent = qData.q;
            
            // 渲染选项
            els.optionsContainer.innerHTML = '';
            qData.options.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = 'option-card p-4 rounded-lg bg-white border border-gray-200 shadow-sm flex items-center gap-3';
                div.onclick = () => selectOption(idx, div);
                div.innerHTML = `
                    <div class="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center text-xs font-bold text-gray-500 option-letter">
                        ${String.fromCharCode(65 + idx)}
                    </div>
                    <span class="text-gray-700">${opt}</span>
                `;
                els.optionsContainer.appendChild(div);
            });

            // 重置按钮状态
            currentState.selectedOption = null;
            els.nextBtn.disabled = true;
            els.nextBtn.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
            els.nextBtn.classList.remove('btn-primary', 'text-white', 'shadow-md');
            els.nextBtn.textContent = currentState.currentQuestionIndex === questions.length - 1 ? '提交本关' : '下一题';
        }

        function selectOption(index, element) {
            // 移除其他选中状态
            const options = els.optionsContainer.children;
            for (let opt of options) {
                opt.classList.remove('selected');
                opt.querySelector('.option-letter').classList.remove('bg-blue-500', 'text-white', 'border-blue-500');
                opt.querySelector('.option-letter').classList.add('border-gray-300', 'text-gray-500');
            }

            // 添加当前选中状态
            element.classList.add('selected');
            const letter = element.querySelector('.option-letter');
            letter.classList.remove('border-gray-300', 'text-gray-500');
            letter.classList.add('bg-blue-500', 'text-white', 'border-blue-500');

            currentState.selectedOption = index;

            // 启用下一题按钮
            els.nextBtn.disabled = false;
            els.nextBtn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
            els.nextBtn.classList.add('btn-primary', 'text-white', 'shadow-md');
        }

        function nextQuestion() {
            if (currentState.selectedOption === null) return;

            const questions = levelsData[currentState.currentLevel];
            const currentQ = questions[currentState.currentQuestionIndex];
            const isCorrect = currentState.selectedOption === currentQ.a;
            
            if (isCorrect) {
                currentState.levelScore += 5; // 每题5分，每关满分100
            } else {
                // 记录错题
                currentState.wrongAnswers.push({
                    question: currentQ.q,
                    userAnswer: currentQ.options[currentState.selectedOption],
                    rightAnswer: currentQ.options[currentQ.a]
                });
            }

            // 判断是否结束本关
            if (currentState.currentQuestionIndex < questions.length - 1) {
                currentState.currentQuestionIndex++;
                loadQuestion();
            } else {
                finishLevel();
            }
        }

        function finishLevel() {
            // 渲染关卡结算页
            els.levelScore.textContent = currentState.levelScore;
            els.levelCorrect.textContent = 20 - currentState.wrongAnswers.length;
            
            // 渲染错题
            if (currentState.wrongAnswers.length === 0) {
                els.wrongAnswersList.innerHTML = '<div class="text-green-600 font-medium"><i class="fas fa-check-circle mr-2"></i>恭喜！本关无错题，太棒了！</div>';
            } else {
                let html = '';
                currentState.wrongAnswers.forEach((item, idx) => {
                    html += `
                        <div class="bg-white p-3 rounded border-l-4 border-red-500">
                            <div class="font-medium text-gray-800 mb-1">${idx + 1}. ${item.question}</div>
                            <div class="text-red-500 text-xs"><span class="font-bold">你的答案:</span> ${item.userAnswer}</div>
                            <div class="text-green-600 text-xs"><span class="font-bold">正确答案:</span> ${item.rightAnswer}</div>
                        </div>
                    `;
                });
                els.wrongAnswersList.innerHTML = html;
            }

            // 保存成绩并更新排行榜
            saveScore(currentState.username, currentState.levelScore, currentState.currentLevel + 1);

            switchPage('levelResult');
        }

        // --- 本地存储与排行榜 ---

        function saveScore(name, score, level) {
            let leaderboard = JSON.parse(localStorage.getItem('drugQuizLeaderboard_v3') || '[]');
            leaderboard.push({
                name: name,
                score: score,
                level: level,
                date: new Date().toLocaleDateString()
            });
            // 排序：分数高在前
            leaderboard.sort((a, b) => b.score - a.score);
            // 只保留前10名
            leaderboard = leaderboard.slice(0, 10);
            localStorage.setItem('drugQuizLeaderboard_v3', JSON.stringify(leaderboard));
        }

        function renderLeaderboard() {
            const leaderboard = JSON.parse(localStorage.getItem('drugQuizLeaderboard_v3') || '[]');
            const container = els.leaderboardList;
            
            if (leaderboard.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 py-10">暂无排名数据</div>';
                return;
            }

            let html = '<ul class="space-y-2">';
            leaderboard.forEach((item, index) => {
                let medal = '';
                let colorClass = 'text-gray-600';
                if (index === 0) { medal = '<i class="fas fa-medal text-yellow-400"></i>'; colorClass = 'text-yellow-600 font-bold'; }
                else if (index === 1) { medal = '<i class="fas fa-medal text-gray-400"></i>'; colorClass = 'text-gray-600 font-bold'; }
                else if (index === 2) { medal = '<i class="fas fa-medal text-orange-400"></i>'; colorClass = 'text-orange-600 font-bold'; }
                else { medal = `<span class="w-5 text-center text-gray-400 text-sm">${index + 1}</span>`; }

                html += `
                    <li class="flex justify-between items-center bg-white p-3 rounded shadow-sm border border-gray-100">
                        <div class="flex items-center gap-3">
                            ${medal}
                            <span class="${colorClass}">${item.name}</span>
                            <span class="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded">第${item.level}关</span>
                        </div>
                        <div class="text-right">
                            <span class="font-bold text-blue-600">${item.score}分</span>
                            <span class="text-xs text-gray-400 block">${item.date}</span>
                        </div>
                    </li>
                `;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        function clearLeaderboard() {
            if(confirm('确定要清空排行榜吗？')) {
                localStorage.removeItem('drugQuizLeaderboard_v3');
                renderLeaderboard();
            }
        }
    </script>
</body>
</html>
